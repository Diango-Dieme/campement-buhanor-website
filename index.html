<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campement Buhanor | Cap Skirring, Casamance – Site en maintenance</title>
<meta name="description" content="Le site du Campement Buhanor, à Cap Randoulène (Cap Skirring, Casamance), est en maintenance. Pour réserver ou connaître nos disponibilités, contactez-nous directement.">
<meta name="theme-color" content="#f8edeb">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f8edeb;
  --surface: #ffffff;
  --ink: #3B260E;
  --ink-soft: #8F543E;
  --line: rgba(69, 38, 29, 0.14);
  --signal: #CE7650;
  --font: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  --radius: 24px;
  --gutter: 24px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font);
  background-color: var(--bg);
  background-image: radial-gradient(rgba(69, 38, 29, 0.16) 1px, transparent 1.2px);
  background-size: 22px 22px;
  color: var(--ink);
  line-height: 1.55;
  min-height: 100dvh;
}

/* Fondu du motif de points vers le fond */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(to bottom, rgba(248,237,235,0) 0%, var(--bg) 85%);
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 56px;
  min-height: 100dvh;
  max-width: 1080px;
  margin: 0 auto;
  padding:
    calc(env(safe-area-inset-top, 0px) + 28px)
    calc(var(--gutter) + env(safe-area-inset-right, 0px))
    calc(env(safe-area-inset-bottom, 0px) + 28px)
    calc(var(--gutter) + env(safe-area-inset-left, 0px));
}

/* ---------- En-tête ---------- */
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: #45261d;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.brand-mark img { width: 26px; height: auto; display: block; }

.brand-name { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.brand-place { font-size: 0.85rem; color: var(--ink-soft); }

/* ---------- Contenu ---------- */
main { display: flex; flex-direction: column; gap: 56px; flex: 1; }

.intro { display: flex; flex-direction: column; align-items: flex-start; }

h1 {
  font-size: clamp(2.75rem, 11vw, 5.5rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.045em;
  margin-bottom: 24px;
  text-wrap: balance;
}

.lead {
  font-size: 1.125rem;
  color: var(--ink-soft);
  max-width: 34ch;
  line-height: 1.5;
  text-wrap: pretty;
}

/* ---------- Boutons ---------- */
.actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  margin-top: 36px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 16px;
  min-height: 72px;
  padding: 0 28px;
  border-radius: 20px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-decoration: none;
  transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}

.btn svg { width: 24px; height: 24px; flex-shrink: 0; }
.btn-text { display: flex; flex-direction: column; text-align: left; line-height: 1.3; }
.btn-label { font-size: 1.0625rem; font-weight: 600; }
.btn-value { font-size: 0.9rem; font-weight: 400; opacity: 0.7; overflow-wrap: anywhere; }

.btn-primary { background: #45261d; color: #fff; border: 1px solid #45261d; }
.btn-primary:hover { background: #3B260E; }

.btn-secondary { background: transparent; color: var(--ink); border: 1px solid rgba(69, 38, 29, 0.35); }
.btn-secondary:hover { background: var(--surface); border-color: var(--ink); }

.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }

/* ---------- Photos ---------- */
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.gallery figure {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--surface);
}

.gallery figure:first-child { grid-column: 1 / -1; }

.gallery img { display: block; width: 100%; height: 100%; object-fit: cover; }
.gallery figure:first-child img { aspect-ratio: 4 / 3; }
.gallery figure:not(:first-child) img { aspect-ratio: 1 / 1; }

.gallery figcaption {
  position: absolute;
  left: 12px;
  bottom: 12px;
  padding: 6px 12px;
  border-radius: 100px;
  background: rgba(248, 237, 235, 0.9);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  font-size: 0.8rem;
  font-weight: 500;
}

/* ---------- Pied de page ---------- */
footer {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-size: 0.85rem;
  color: var(--ink-soft);
}

/* ---------- Tablette et bureau ---------- */
@media (min-width: 768px) {
  :root { --gutter: 48px; }
  .page { gap: 72px; padding-top: calc(env(safe-area-inset-top, 0px) + 40px); }
  .actions { flex-direction: row; width: auto; }
  .lead { max-width: 40ch; }
  footer { flex-direction: row; justify-content: space-between; }
}

@media (min-width: 1000px) {
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>

  </main>
